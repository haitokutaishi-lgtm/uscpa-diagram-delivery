# topic-spec や knowledge/ が変わったら、knowledge/index.md・traps-index.md と毎日問題のストック（daily-question-bank.json）を作り直してコミットする
name: ナレッジ索引の更新

on:
  push:
    branches: [main]
    paths:
      - "schedule/topic-specs/**"
      - "knowledge/topics/**"
      - "ops/diagram-publish-manifest.json"
      - "ops/build_knowledge_index.py"
      - "ops/build_daily_bank.py"
      - "schedule/daily-extra-questions.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knowledge-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build index
        run: |
          python ops/build_knowledge_index.py
          python ops/build_daily_bank.py
      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/index.md knowledge/traps-index.md schedule/daily-question-bank.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore(knowledge): rebuild index"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
